<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Card Flip Game</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <h1>Memory Card Flip Game</h1>
        <button id="restartButton">Restart</button>
    </header>

    <!-- Move counter -->
    <div id="movesCounter" style="margin-bottom: 20px; font-size: 18px;">
        Moves: 0
    </div>

    <!-- Game board -->
    <div id="gameBoard" class="game-board"></div>

    <!-- Popup message -->
    <div id="popup" style="display:none; 
                       position:fixed; 
                       top:50%; 
                       left:50%; 
                       transform:translate(-50%, -50%);
                       background:#fff;
                       color:#000;
                       padding:30px;
                       border-radius:10px;
                       text-align:center;
                       font-size:20px;
                       box-shadow:0 0 20px rgba(0,0,0,0.5);">
        <p id="popupMessage"></p>
        <button id="popupRestart">Play Again</button>
    </div>


    <script src="script.js"></script>
</body>

</html>
