<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="min-h-screen bg-gray-100 flex justify-center items-center">
        <div class="bg-white p-6 rounded-2xl shadow-md w-full max-w-md">
            <h1 class="text-2xl font-bold text-center text-gray-800 mb-4">
                Income Expense Tracker
            </h1>
            <div>
                <input type="text" id="descInput" placeholder="Description"
                    class="w-full border border-gray-300 rounded-lg p-2 mb-3 focus: outline-none focus:ring-2 focus:ring-blue-400">

                <div class="flex gap-2 mb-3">
                    <input type="number" id="inputId" placeholder="Amount"
                        class="w-1/2 border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400">

                    <select id="typeSelect"
                        class="w-1/2 border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus-ring-400">
                        <option value="">Type</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>

                <div class="flex gap-3 mt-5">
                    <button id="addBtn" onclick="onSubmit()"
                        class="bg-blue-500 text-white px-4 py-2 rounded-lg w-full hover:bg-blue-600 transition">
                        Submit
                    </button>

                    <button id="resetBtn" onclick="onReset()"
                        class="bg-gray-500 text-white px-4 py-2 rounded-lg w-full hover:bg-gray-600 transition">
                        Reset
                    </button>
                </div>
            </div>

            <div id="summary" class="grid grid-cols-1 sm:grid-cols-3 gap-3 my-6">
                <div class="bg-green-100 p-3 rounded-lg text-center shadow-sm">
                    <p class="text-md font-semibold text-gray-600">Income</p>
                    <h2 id="totalIncome" class="text-lg font-semibold text-green-700"></h2>
                </div>
                <div class="bg-red-100 p-3 rounded-lg text-center shadow-sm">
                    <p class="text-md font-semibold text-gray-600">Expense</p>
                    <h2 id="totalExpense" class="text-lg font-semibold text-red-700"></h2>
                </div>
                <div class="bg-blue-100 p-3 rounded-lg text-center shadow-sm">
                    <p class="text-md font-semibold text-gray-600">Balance</p>
                    <h2 id="balance" class="text-lg font-semibold text-blue-700"></h2>
                </div>
            </div>

            <div class="flex justify-center gap-6 my-4">
                <label class="flex items-center gap-2 font-semibold text-gray-800 cursor-pointer">
                    <input type="radio" name="filter" checked value="all" class="accent-blue-500">
                    All
                </label>
                <label class="flex items-center gap-2 font-semibold text-gray-800 cursor-pointer">
                    <input type="radio" name="filter" value="income" class="accent-blue-500">
                    Income
                </label>
                <label class="flex items-center gap-2 font-semibold text-gray-800 cursor-pointer">
                    <input type="radio" name="filter" value="expense" class="accent-blue-500">
                    Expense
                </label>
            </div>

            <div id="listContainer" class="transition-opacity duration-200">

            </div>

        </div>

    </div>

    <script src="./script.js"></script>
</body>

</html>
