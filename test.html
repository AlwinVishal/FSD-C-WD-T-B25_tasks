<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Body into Two Halves</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
        }

        .container {
            display: flex;
            height: 100%;
        }

        .half {
            width: 50%;
            height: 100%;
            border: 1px solid black; /* Optional, for visibility */
        }

        .left {
            background-color: lightblue;
        }

        .right {
            background-color: lightgreen;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="half left">
            <!-- Left half content -->
            <h1>Left Half</h1>
            <p>This is the left half of the body.</p>
        </div>
        <div class="half right">
            <!-- Right half content -->
            <h1>Right Half</h1>
            <p>This is the right half of the body.</p>
        </div>
    </div>

</body>
</html>
